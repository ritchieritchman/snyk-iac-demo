name: Snyk and Checkov Infrastructure as Code
on: push
jobs:
  snyk-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Snyk to check Terraform for issues
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: main.tf
        continue-on-error: true

  checkov-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Checkov to check Terraform for issues
        uses: bridgecrewio/checkov-action@master
        with:
          file: main.tf
          framework: terraform
          soft_fail: true
